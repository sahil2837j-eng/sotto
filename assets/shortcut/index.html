<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sotto shortcut</title>
<style>
  :root{
    --violet:#7C3AED; --violet-2:#A78BFA; --cyan:#22D3EE;
    --ink:#EDE9FE; --muted:#A99FD0; --line:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{
    font-family:"Cantarell","Fira Sans","DejaVu Sans",sans-serif;
    background:#0B0718; color:var(--ink);
  }
  .stage{
    position:relative; width:1280px; height:720px;
    background:
      radial-gradient(900px 520px at 18% 8%, rgba(124,58,237,.34), transparent 62%),
      radial-gradient(760px 520px at 88% 96%, rgba(8,145,178,.30), transparent 60%),
      linear-gradient(135deg,#150A30 0%,#100A24 45%,#071A24 100%);
  }
  .grain{
    position:absolute; inset:0; opacity:.16; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.22) 1px, transparent 1px);
    background-size:3px 3px; mix-blend-mode:overlay;
  }

  .brand{
    position:absolute; left:64px; top:46px; display:flex; align-items:center; gap:12px;
    opacity:.8; font-size:15px; letter-spacing:.4px;
  }
  .brand img{width:28px;height:28px;border-radius:7px}
  .brand b{font-weight:600;color:#E7E1FF}
  .brand span{color:#8D7FB4}

  .eyebrow{
    position:absolute; left:0; right:0; top:126px; text-align:center;
    font-size:14px; letter-spacing:4.5px; text-transform:uppercase;
    color:var(--violet-2); font-weight:600;
  }
  .headline{
    position:absolute; left:0; right:0; top:156px; text-align:center;
    font-size:31px; letter-spacing:-.4px; color:#E8E2FF; font-weight:600;
  }
  .headline span{color:#B7A7E8;font-weight:400}

  .deck{
    position:absolute; left:50%; top:232px; transform:translateX(-50%);
    width:900px; height:174px; border-radius:26px;
    background:linear-gradient(180deg,rgba(31,19,62,.85),rgba(15,10,34,.90));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    display:flex; align-items:center; justify-content:center; gap:22px;
  }
  .plus{font-size:30px;color:#6F5F9C;font-weight:400;user-select:none}
  .key{
    position:relative; display:flex; align-items:center; justify-content:center;
    height:132px; border-radius:17px;
    background:linear-gradient(180deg,#2C1B56 0%,#1B1136 100%);
    border:1px solid rgba(255,255,255,.13);
    border-bottom:8px solid rgba(0,0,0,.50);
    box-shadow:0 14px 26px rgba(0,0,0,.40), inset 0 1px 0 rgba(255,255,255,.10);
    font-family:inherit; font-size:34px; font-weight:600;
    letter-spacing:.2px; color:#DCD3F7; transition:none;
  }
  .key.ctrl,.key.alt{width:164px}
  .key.space{width:314px;font-size:30px;letter-spacing:1px}
  .key.on{
    transform:translateY(7px); border-bottom-width:2px;
    background:linear-gradient(180deg,#6D28D9,#4C1D95);
    border-color:#A78BFA; color:#fff;
    box-shadow:0 0 0 2px rgba(167,139,250,.35), 0 0 48px rgba(124,58,237,.55),
               inset 0 1px 0 rgba(255,255,255,.25);
  }
  .key::after{
    content:""; position:absolute; left:14px; right:14px; bottom:10px; height:1px;
    background:rgba(255,255,255,.08); border-radius:1px;
  }
  .key.on::after{background:rgba(255,255,255,.20)}

  .micro{
    position:absolute; left:0; right:0; top:424px; text-align:center;
    font-size:18px; letter-spacing:.2px; color:#A99FD0;
  }
  .micro b{color:#D9D1F5;font-weight:600}

  .pillwrap{position:absolute;left:0;right:0;top:470px;display:flex;justify-content:center}
  .pill{
    display:flex; align-items:center; justify-content:center; gap:13px;
    height:64px; padding:0 24px 0 16px; min-width:380px;
    border-radius:32px; background:rgba(22,12,46,.92);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .pill img{width:32px;height:32px;border-radius:8px}
  .dot{
    width:8px;height:8px;border-radius:50%;background:#FB7185;
    box-shadow:0 0 10px rgba(251,113,133,.9);display:none;
  }
  .bars{display:none;align-items:center;gap:3px;height:26px}
  .bars i{width:3px;border-radius:2px;background:var(--cyan);display:block}
  .check{
    width:20px;height:20px;border-radius:50%;
    background:rgba(52,211,153,.16); border:1px solid rgba(52,211,153,.5);
    display:none; align-items:center; justify-content:center;
    font-size:12px; color:#6EE7B7;
  }
  .label{font-size:14px;color:#C9BFF0;min-width:82px}

  .prompt{
    position:absolute; left:0; right:0; top:556px; text-align:center;
    font-size:23px; letter-spacing:.1px; color:#E7E1FF; font-weight:500;
  }
  .prompt small{
    display:block; margin-top:9px; font-size:15px; font-weight:400;
    letter-spacing:.2px; color:#9486BD;
  }
  .footer{
    position:absolute; left:0; right:0; bottom:42px; text-align:center;
    font-size:14px; letter-spacing:.5px; color:#8D7FB4;
  }
  .footer b{color:#C4B8E6;font-weight:500}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="grain"></div>

  <div class="brand">
    <img src="../icon-256.png" alt="">
    <b>sotto</b><span>— offline voice typing</span>
  </div>

  <div class="eyebrow">the shortcut</div>
  <div class="headline">Press it once. <span>Press it again.</span></div>

  <div class="deck">
    <kbd class="key ctrl" id="k1">Ctrl</kbd><span class="plus">+</span>
    <kbd class="key alt" id="k2">Alt</kbd><span class="plus">+</span>
    <kbd class="key space" id="k3">Space</kbd>
  </div>

  <div class="micro">hold <b>Ctrl</b> + <b>Alt</b>, tap <b>Space</b></div>

  <div class="pillwrap">
    <div class="pill" id="pill">
      <img src="../icon-256.png" alt="">
      <span class="dot" id="dot"></span>
      <div class="bars" id="bars">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <span class="check" id="check">✓</span>
      <span class="label" id="label">ready</span>
    </div>
  </div>

  <div class="prompt" id="prompt">Press once to start.<small>There is no separate stop key.</small></div>

  <div class="footer"><b>Ctrl + Alt + Space</b> &nbsp;·&nbsp; start and stop &nbsp;·&nbsp; works in any app</div>
</div>

<script>
const k1 = document.getElementById("k1");
const k2 = document.getElementById("k2");
const k3 = document.getElementById("k3");
const pill = document.getElementById("pill");
const dot = document.getElementById("dot");
const barsEl = document.getElementById("bars");
const bars = [...document.querySelectorAll("#bars i")];
const check = document.getElementById("check");
const label = document.getElementById("label");
const prompt = document.getElementById("prompt");
const stage = document.getElementById("stage");

// Cues: [from, to, line, subline]
const CUES = [
  [0,     900,  "Press once to start.",           "There is no separate stop key."],
  [900,   2550, "Listening…",                     "Speak normally. Words appear as you talk."],
  [2550,  3650, "Press the same keys again.",     "This time it stops."],
  [3650,  3950, "Stopping…",                      "The rest is transcribed and typed."],
  [3950,  5250, "Done.",                          "One shortcut. Two presses."],
  [5250,  6000, "Ctrl + Alt + Space.",            "Start or stop — the same chord."],
];

function ease(x){ return x < 0 ? 0 : x > 1 ? 1 : x*x*(3-2*x); }

function renderAt(t) {
  const press1 = t >= 900 && t < 1200;
  const press2 = t >= 3650 && t < 3950;
  const pressed = press1 || press2;
  const listening = t >= 900 && t < 3650;
  const stopping = t >= 3650 && t < 3950;
  const done = t >= 3950 && t < 5250;

  [k1, k2, k3].forEach(k => k.classList.toggle("on", pressed));
  pill.style.transform = "scale(" + (pressed ? 1.045 : 1) + ")";

  dot.style.display = listening ? "block" : "none";
  barsEl.style.display = listening ? "flex" : "none";
  bars.forEach((b, i) => {
    b.style.display = listening ? "block" : "none";
    if (listening) {
      const h = 6 + 17 * Math.abs(Math.sin(t / 155 + i * 1.9)) *
                    (0.55 + 0.45 * Math.abs(Math.sin(t / 480 + i)));
      b.style.height = h.toFixed(1) + "px";
      b.style.opacity = String(0.65 + 0.35 * Math.abs(Math.sin(t / 300 + i)));
    }
  });
  check.style.display = done ? "flex" : "none";
  label.textContent = listening ? "listening…" : stopping ? "stopping…" :
                      done ? "done" : "ready";

  const cue = CUES.find(([a, b]) => t >= a && t < b) || CUES[0];
  prompt.innerHTML = cue[2] + "<small>" + cue[3] + "</small>";
  prompt.style.opacity = String(t > 5800 ? Math.max(0, 1 - (t - 5800) / 200) : 1);

  // tiny breathing glow on the deck while listening
  stage.style.filter = listening ? "brightness(1.03)" : "brightness(1)";
}

window.renderAt = renderAt;
if (!location.search.includes("record")) {
  const t0 = performance.now();
  (function loop(now) { renderAt((now - t0) % 6000); requestAnimationFrame(loop); })(t0);
}
renderAt(0);
</script>
</body>
</html>
