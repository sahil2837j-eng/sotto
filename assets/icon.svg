<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sotto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B0F8F"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9F4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="116.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>

  <!-- the S: a whisper drawn in one stroke -->
  <path d="M336 170 C 336 128 294 108 252 108 C 200 108 168 140 168 184
           C 168 232 212 246 260 257 C 310 269 346 286 346 336
           C 346 386 300 412 250 412 C 200 412 164 388 160 344"
        fill="none" stroke="url(#mark)" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- voice, trailing off -->
  <g fill="#FFFFFF" opacity="0.5">
    <rect x="378" y="318" width="12" height="34" rx="6"/>
    <rect x="404" y="298" width="12" height="74" rx="6"/>
    <rect x="430" y="326" width="12" height="18" rx="6"/>
  </g>
</svg>
